<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | Forabita</title>
  <link rel="icon" href="assets/forabita-logo.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div data-site-header></div>
  <main class="site-main">
    <section class="access-shell">
      <div class="container">
        <div class="access-card" style="margin:auto">
          <div class="tabs"><button class="tab-button" data-tab="login" type="button">Iniciar sesión</button><button class="tab-button" data-tab="registro" type="button">Crear cuenta</button></div>
          <div class="tab-panel" data-panel="login">
            <p class="eyebrow">Bienvenido de nuevo</p><h2>Inicia sesión</h2><p class="lead">Continúa explorando tus opciones guardadas.</p>
            <form data-demo-form data-success="Sesión iniciada en modo demostración.">
              <div class="field"><label for="login-email">Correo</label><input class="input" id="login-email" type="email" required placeholder="tu@correo.com"></div>
              <div class="field"><label for="login-password">Contraseña</label><input class="input" id="login-password" type="password" minlength="8" required></div>
              <label class="check-row"><input type="checkbox"> Recordar mi sesión</label>
              <button class="button button-block" type="submit">Iniciar sesión</button>
            </form>
          </div>
          <div class="tab-panel" data-panel="registro">
            <p class="eyebrow">Comienza tu búsqueda</p><h2>Crea tu cuenta</h2><p class="lead">Este registro es solamente demostrativo y no almacena datos.</p>
            <form data-demo-form data-success="Cuenta creada en modo demostración.">
              <div class="field"><label for="register-name">Nombre</label><input class="input" id="register-name" required></div>
              <div class="field"><label for="register-email">Correo</label><input class="input" id="register-email" type="email" required></div>
              <div class="field"><label for="register-role">Tipo de usuario</label><select class="select" id="register-role" required><option>Estudiante</option><option>Madre, padre o tutor</option><option>Arrendador</option></select></div>
              <div class="field"><label for="register-password">Contraseña</label><input class="input" id="register-password" type="password" minlength="8" required><small style="color:var(--muted)">Mínimo 8 caracteres.</small></div>
              <label class="check-row"><input type="checkbox" required> Acepto los términos de esta demostración.</label>
              <button class="button button-block" type="submit">Crear cuenta</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
